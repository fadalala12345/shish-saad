<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#2f4a3a">
<title>شيش سعد - اطلب أونلاين</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#faf8f3;--card:#ffffff;--ink:#23302a;--mute:#6b766f;--line:#e4e0d4;--brand:#2f4a3a;--on-brand:#ffffff;--accent:#e2a22b;--price:#b8402b;--chip:#efeadb}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17201b;--card:#1f2b24;--ink:#eef0e8;--mute:#9aa79e;--line:#32423a;--brand:#e2a22b;--on-brand:#1b1f1a;--accent:#e2a22b;--price:#f0a58f;--chip:#2a3a31}}
:root[data-theme="dark"]{--bg:#17201b;--card:#1f2b24;--ink:#eef0e8;--mute:#9aa79e;--line:#32423a;--brand:#e2a22b;--on-brand:#1b1f1a;--accent:#e2a22b;--price:#f0a58f;--chip:#2a3a31}
*{box-sizing:border-box;margin:0}
html{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);scroll-padding-top:120px}
body{background:var(--bg);color:var(--ink);font-family:Tajawal,Tahoma,sans-serif;line-height:1.6;padding-bottom:96px}
header{padding:28px 18px 18px;background:var(--brand);color:var(--on-brand)}
header h1{font-size:34px;font-weight:800;line-height:1.2}
header p{opacity:.85;font-size:15px;margin-top:4px}
.cats{position:sticky;top:0;z-index:5;display:flex;gap:8px;overflow-x:auto;padding:10px 14px;background:var(--bg);border-bottom:1px solid var(--line)}
.cats button{flex:none;border:0;background:var(--chip);color:var(--ink);font:inherit;font-weight:500;padding:8px 16px;border-radius:20px;cursor:pointer}
.cats button.on{background:var(--brand);color:var(--on-brand)}
main{padding:6px 14px;max-width:640px;margin:auto}
h2{font-size:21px;font-weight:800;margin:22px 0 4px}
.item{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.item b{font-size:17px;font-weight:700}
.item small{display:block;color:var(--mute);font-size:14px}
.price{color:var(--price);font-weight:700;margin-top:2px}
.qty{display:flex;align-items:center;gap:10px;flex:none}
.qty button{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:20px;cursor:pointer}
.qty .add{background:var(--brand);color:var(--on-brand);border-color:var(--brand)}
.qty span{min-width:18px;text-align:center;font-weight:700}
.bar{position:fixed;inset:auto 0 0 0;padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:1px solid var(--line);display:none;z-index:6}
.bar.show{display:block}
.bar button,.send{width:100%;max-width:640px;display:flex;justify-content:space-between;margin:auto;border:0;background:var(--brand);color:var(--on-brand);font:inherit;font-weight:700;font-size:17px;padding:14px 18px;border-radius:12px;cursor:pointer}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;z-index:9;align-items:flex-end}
.sheet.show{display:flex}
.panel{background:var(--bg);width:100%;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));max-width:640px;margin:auto}
.panel h3{font-size:22px;margin-bottom:8px}
.row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line)}
.total{font-weight:800;font-size:19px;margin:12px 0}
label{display:block;font-weight:500;margin-top:12px}
input,textarea{width:100%;margin-top:4px;padding:11px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit}
.type{display:flex;gap:8px;margin-top:6px}
.type button{flex:1;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;cursor:pointer}
.type button.on{background:var(--brand);color:var(--on-brand);border-color:var(--brand)}
.err{color:var(--price);font-size:14px;margin-top:8px;min-height:20px}
.close{background:none;border:0;color:var(--mute);font:inherit;margin-top:10px;cursor:pointer;width:100%}
.ord{border-bottom:1px solid var(--line);padding:6px 0}.ord .row{border:0;padding:4px 0}.acts{display:flex;gap:6px;align-items:center;flex-wrap:wrap}.mini{border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:13px;padding:5px 10px;border-radius:8px;cursor:pointer}.st{font-size:13px;color:var(--mute);margin-inline-end:auto}.st.ok{color:#3f9b5f}.st.no{color:var(--price)}
.dev{display:block;font-size:13px;opacity:.85;color:inherit;text-decoration:none;margin-bottom:8px}
#astats h3{font-size:17px;margin:18px 0 4px}
</style>
</head>
<body>
<header>
  <a class="dev" href="tel:0924803945">تصميم وتطوير: 0924803945</a>
  <h1 id="rname"></h1>
  <p id="tag"></p>
  <p id="wnum" style="font-weight:700;margin-top:6px"></p>
  <p id="ostate" style="margin-top:2px"></p>
  <input id="q" type="search" placeholder="ابحث في القائمة…" aria-label="بحث" style="width:100%;margin-top:12px;border:0;border-radius:10px;padding:10px 12px;background:rgba(255,255,255,.92);color:#23302a;font:inherit">
</header>
<nav class="cats" id="cats" aria-label="التصنيفات"></nav>
<main id="menu"></main>

<button class="close" id="adm" style="display:none;margin:20px auto">لوحة المتابعة (لصاحب المطعم)</button>
<div class="bar" id="bar"><button id="open"><span id="cnt"></span><span id="sum"></span></button></div>

<div class="sheet" id="sheet">
  <div class="panel">
    <h3>طلبك</h3>
    <p id="ono" style="color:var(--mute);font-size:14px;margin-bottom:6px"></p>
    <div id="lines"></div>
    <div class="row" id="feerow"></div>
    <div class="row total"><span>الإجمالي</span><span id="total"></span></div>
    <div class="type"><button data-t="توصيل" class="on">توصيل</button><button data-t="استلام من المطعم">استلام</button></div>
    <label>الاسم<input id="nm" autocomplete="name"></label>
    <label>رقم الهاتف<input id="ph" type="tel" inputmode="tel" autocomplete="tel"></label>
    <label id="adl">العنوان<textarea id="ad" rows="2"></textarea><button type="button" class="mini" id="loc" style="margin-top:6px">📍 إرفاق موقعي</button> <span id="locst" style="font-size:13px;color:var(--mute)"></span><input id="locin" type="text" placeholder="وصف مكانك أو رابط موقعك (اختياري)"></label>
    <label>ملاحظات (اختياري)<input id="nt"></label>
    <div class="err" id="err" role="alert"></div>
    <p id="wnote" style="color:var(--mute);font-size:14px;margin-top:10px"></p>
    <button class="send" id="send"><span>إرسال الطلب عبر واتساب</span></button>
    <button class="close" id="saveonly" style="display:none">حفظ في السجل بدون واتساب</button>
    <button class="close" id="close">رجوع للقائمة</button>
  </div>
</div>

<div class="sheet" id="admin"><div class="panel"><h3>لوحة المتابعة</h3><div id="astats"></div><button class="close" id="aclose">إغلاق</button></div></div>

<script>
/* ===== إعدادات المطعم: عدّل هنا فقط ===== */
const CONFIG={
  name:"شيش سعد",
  tagline:"بوكسات وساندويتشات مشوية، اطلب ونوصلها لك",
  whatsapp:"218926521667", // رقم واتساب المطعم بصيغة دولية بدون + أو أصفار
  currency:"$",
  deliveryFee:0, // رسوم التوصيل (0 = مجاني)
  minOrder:0, // أقل قيمة للطلب (0 = بدون حد)
  hours:null // مثال: {open:"12:00",close:"23:30"}
};
/* الأصناف: عدّل الأسماء والأسعار أو أضف أصنافاً جديدة */
const MENU=[
  {cat:"البوكسات",items:[
    {id:1,name:"بوكس شيش",desc:"",price:22},
    {id:2,name:"بوكس كباب",desc:"",price:22},
    {id:3,name:"بوكس مشكل",desc:"",price:22},
    {id:4,name:"بوكس برجر كلاسيك",desc:"",price:15},
    {id:5,name:"بوكس برجر سعد",desc:"",price:18},
    {id:6,name:"بوكس السعادة",desc:"",price:80},
    {id:7,name:"بوكس اسكالوب مشوي",desc:"",price:18},
    {id:8,name:"بوكس دبل",desc:"",price:45},
    {id:9,name:"بوكس عائلي",desc:"",price:100},
    {id:10,name:"بوكس أسياخ مشكل",desc:"",price:28},
    {id:11,name:"بوكس شيش سعد",desc:"",price:18},
    {id:12,name:"بوكس فاهيتا دجاج",desc:"",price:15}]},
  {cat:"الساندويتشات",items:[
    {id:13,name:"شيش سعد",desc:"",price:16},
    {id:14,name:"برجر سعد",desc:"",price:16},
    {id:15,name:"شيش جبنة",desc:"",price:10},
    {id:16,name:"كباب جبنة",desc:"",price:10},
    {id:17,name:"كباب دبل",desc:"",price:15},
    {id:18,name:"كباب طرب",desc:"",price:12},
    {id:19,name:"برجر كلاسيك",desc:"",price:10},
    {id:20,name:"اسكالوب مشوي",desc:"",price:15},
    {id:21,name:"فاهيتا دجاج",desc:"",price:12}]},
  {cat:"الإضافات",items:[
    {id:22,name:"بطاطا كبيرة",desc:"",price:10},
    {id:23,name:"بطاطا صغيرة",desc:"",price:5},
    {id:24,name:"بطاطا شيش سعد",desc:"",price:20},
    {id:25,name:"بطاطا بالصوص صغيرة",desc:"",price:8},
    {id:26,name:"بطاطا بالصوص كبيرة",desc:"",price:15},
    {id:27,name:"بطاطا كباب سعد",desc:"",price:20},
    {id:28,name:"مشروب غازي",desc:"",price:3},
    {id:29,name:"عصير طبيعي",desc:"",price:6},
    {id:30,name:"علبة صوص",desc:"",price:3}]}
];

const ICONS=["🍱","🥙","🍟"];
const PHONE=/^(\+?218|0)?9\d{8}$/;
const toEn=t=>t.replace(/[٠-٩]/g,d=>"٠١٢٣٤٥٦٧٨٩".indexOf(d));
let curNo="",LOC="";
const getLoc=()=>LOC||((($("#locin")||{}).value)||"").trim();
const $=s=>document.querySelector(s);
const cart={};            // id -> quantity
const all=MENU.flatMap((c,ci)=>c.items.map((p,i)=>({...p,cat:c.cat,line:0})));
const byId=Object.fromEntries(all.map(p=>(p.id,[p.id,p])));
const money=n=>n.toLocaleString("ar-LY")+" "+CONFIG.currency;
let orderType="توصيل";

$("#rname").textContent=CONFIG.name;
$("#tag").textContent=CONFIG.tagline;
const LOCAL="0"+CONFIG.whatsapp.slice(3);
$("#wnum").textContent="واتساب الطلبات: "+LOCAL;
$("#wnote").textContent="سيصل طلبك إلى واتساب المطعم "+LOCAL+". اضغط إرسال داخل واتساب لتكملة الطلب.";
document.title=CONFIG.name+" - اطلب أونلاين";

$("#cats").innerHTML=MENU.map((c,i)=>`<button data-i="${i}" class="${i?"":"on"}">${ICONS[i]||""} ${c.cat}</button>`).join("");
$("#menu").innerHTML=MENU.map((c,i)=>`<section id="c${i}"><h2>${ICONS[i]||""} ${c.cat}</h2>`+c.items.map(p=>`
  <div class="item" data-n="${p.name}"><div><b>${p.name}</b>${p.desc?`<small>${p.desc}</small>`:""}<div class="price">${money(p.price)}</div></div>
  <div class="qty" data-id="${p.id}"></div></div>`).join("")+`</section>`).join("");

function drawQty(id){
  const el=document.querySelector(`.qty[data-id="${id}"]`),q=cart[id]||0;
  el.innerHTML=q?`<button data-a="-" aria-label="إنقاص">−</button><span>${q}</span><button data-a="+" class="add" aria-label="زيادة">+</button>`
               :`<button data-a="+" class="add" aria-label="أضف للطلب">+</button>`;
}
try{Object.assign(cart,JSON.parse(localStorage.getItem("ss_cart")||"{}"))}catch(e){}
for(const k in cart){if(!byId[k]||!(cart[k]>0))delete cart[k]}
all.forEach(p=>drawQty(p.id));
setTimeout(refresh,0);
$("#q").oninput=()=>{
  const t=$("#q").value.trim();
  document.querySelectorAll(".item").forEach(it=>it.style.display=(!t||it.dataset.n.includes(t))?"":"none");
  document.querySelectorAll("main section").forEach(sec=>{sec.style.display=[...sec.querySelectorAll(".item")].some(i=>i.style.display!=="none")?"":"none"});
};
function openState(){
  const h=CONFIG.hours;if(!h)return"";
  const m=t=>{const[a,b]=t.split(":");return +a*60+ +b};
  const d=new Date(),now=d.getHours()*60+d.getMinutes(),o=m(h.open),c=m(h.close);
  const open=o<=c?(now>=o&&now<c):(now>=o||now<c);
  return open?"🟢 مفتوح الآن (حتى "+h.close+")":"🔴 مغلق الآن (يفتح "+h.open+")";
}
$("#ostate").textContent=openState();

function totals(){
  let n=0,s=0;
  for(const id in cart){n+=cart[id];s+=cart[id]*byId[id].price}
  return{n,s};
}
function refresh(){
  try{localStorage.setItem("ss_cart",JSON.stringify(cart))}catch(e){}
  const{n,s}=totals();
  $("#bar").classList.toggle("show",n>0);
  $("#cnt").textContent="عرض الطلب ("+n+")";
  $("#sum").textContent=money(s);
}
$("#menu").addEventListener("click",e=>{
  const b=e.target.closest("button[data-a]");if(!b)return;
  const id=b.parentElement.dataset.id;
  cart[id]=Math.max(0,(cart[id]||0)+(b.dataset.a==="+"?1:-1));
  if(!cart[id])delete cart[id];
  drawQty(id);refresh();
});
$("#cats").addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b)return;
  document.querySelectorAll("#cats button").forEach(x=>x.classList.toggle("on",x===b));
  $("#c"+b.dataset.i).scrollIntoView({behavior:"smooth"});
});

function lines(){
  const rows=Object.keys(cart).map(id=>{
    const p=byId[id],q=cart[id];
    return{p,q,amt:q*p.price};
  });
  return rows;
}
const fee=()=>orderType==="توصيل"?CONFIG.deliveryFee:0;
const grand=()=>totals().s+fee();
function renderTotal(){
  $("#feerow").style.display=fee()?"flex":"none";
  $("#feerow").innerHTML=fee()?"<span>رسوم التوصيل</span><span>"+money(fee())+"</span>":"";
  $("#total").textContent=money(grand());
}
function openSheet(){
  curNo="SS"+String(Date.now()).slice(-6);
  $("#ono").textContent="رقم الطلب: "+curNo;
  const rows=lines();
  $("#lines").innerHTML=rows.map(r=>`<div class="row"><span>${r.q} × ${r.p.name}</span><span>${money(r.amt)}</span></div>`).join("");
  renderTotal();
  $("#err").textContent="";
  $("#sheet").classList.add("show");
}
$("#open").onclick=openSheet;
$("#close").onclick=()=>$("#sheet").classList.remove("show");
document.querySelectorAll(".type button").forEach(b=>b.onclick=()=>{
  document.querySelectorAll(".type button").forEach(x=>x.classList.toggle("on",x===b));
  orderType=b.dataset.t;renderTotal();
  $("#adl").style.display=orderType==="توصيل"?"block":"none";
});

function bad(sel,msg){
  const er=$("#err");er.style.color="";er.textContent=msg;
  const el=$(sel);
  if(el){el.style.borderColor="var(--price)";el.addEventListener("input",()=>{el.style.borderColor=""},{once:true});el.focus({preventScroll:true});el.scrollIntoView({block:"center",behavior:"smooth"})}
}
$("#send").onclick=()=>{
  const nm=$("#nm").value.trim(),ph=$("#ph").value.trim(),ad=$("#ad").value.trim(),nt=$("#nt").value.trim();
  if(!nm){return bad("#nm","اكتب اسمك.")}
  if(!ph){return bad("#ph","اكتب رقم هاتفك.")}
  if(!PHONE.test(toEn(ph).replace(/[\s-]/g,""))){return bad("#ph","رقم الهاتف غير صحيح. مثال: 0912345678")}
  if(totals().s<CONFIG.minOrder){$("#err").textContent="أقل قيمة للطلب "+money(CONFIG.minOrder);return}
  if(orderType==="توصيل"&&!ad&&!getLoc()){return bad("#ad","اكتب عنوان التوصيل أو موقعك.")}
  const rows=lines();
  const text=[
    "طلب جديد - "+CONFIG.name+" ("+curNo+")",
    "",
    ...rows.map(r=>"• "+r.q+" × "+r.p.name+" = "+money(r.amt)),
    "",
    fee()?"رسوم التوصيل: "+money(fee()):"",
    "الإجمالي: "+money(grand()),
    "نوع الطلب: "+orderType,
    "الاسم: "+nm,
    "الهاتف: "+ph,
    orderType==="توصيل"&&ad?"العنوان: "+ad:"",
    orderType==="توصيل"&&getLoc()?"الموقع: "+getLoc():"",
    nt?"ملاحظات: "+nt:""
  ].filter((l,i,a)=>l!==""||a[i-1]!=="").join("\n");
  if(DB&&CAN)DB.collection("orders").doc(sid()).set(build()).catch(()=>{});
  const url="https://wa.me/"+CONFIG.whatsapp+"?text="+encodeURIComponent(text);
  const w=window.open(url,"_blank");
  if(w){const er0=$("#err");er0.style.color="#3f9b5f";er0.textContent="تم فتح واتساب ✓ اضغط إرسال داخل واتساب لإكمال طلبك.";}
  if(!w){
    const er=$("#err");
    er.innerHTML='<a href="'+url+'" target="_blank" rel="noopener" style="color:var(--brand);font-weight:700">اضغط هنا لفتح واتساب</a> &nbsp;|&nbsp; <a href="#" id="cp" style="color:var(--brand);font-weight:700">نسخ الرسالة</a>';
    $("#cp").onclick=ev=>{
      ev.preventDefault();
      const t=document.createElement("textarea");
      t.value=text;document.body.appendChild(t);t.select();
      try{document.execCommand("copy");er.textContent="تم نسخ الرسالة. الصقها في واتساب على الرقم 0"+CONFIG.whatsapp.slice(3)}
      catch(x){er.textContent="تعذّر النسخ."}
      t.remove();
    };
  }
};

const io=new IntersectionObserver(es=>es.forEach(en=>{
  if(!en.isIntersecting)return;
  const i=en.target.id.slice(1);
  document.querySelectorAll("#cats button").forEach(x=>x.classList.toggle("on",x.dataset.i===i));
}),{rootMargin:"-25% 0px -65% 0px"});
document.querySelectorAll("main section").forEach(s=>io.observe(s));

/* ===== سجل الطلبات ولوحة المتابعة (تعمل لصاحب الصفحة فقط) ===== */
let DB=null,CAN=false;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const sid=()=>"o"+Date.now();
(async()=>{try{
  if(!window.claude)return;
  DB=await claude.use("db");
  const u=await claude.use("user");
  CAN=!!(u&&u.canEdit());
  if(DB&&CAN){$("#adm").style.display="block";$("#saveonly").style.display="block"}
}catch(e){}})();
function build(st){
  const f=k=>$(k).value.trim();
  return{createdAt:Date.now(),status:st||"جديد",type:orderType,name:f("#nm"),phone:f("#ph"),address:f("#ad"),note:f("#nt"),orderNo:curNo,subtotal:totals().s,fee:fee(),total:grand(),loc:getLoc(),
    lines:lines().map(r=>({pid:r.p.id,name:r.p.name,cat:r.p.cat,qty:r.q,unit:r.p.price,amt:r.amt}))};
}
$("#saveonly").onclick=async()=>{
  try{
    if(!DB){$("#err").textContent="قاعدة البيانات غير متاحة. سجّل الدخول وأعد فتح الصفحة.";return}
    if(!totals().n){$("#err").textContent="السلة فارغة.";return}
    $("#err").textContent="جارٍ الحفظ…";
    await DB.collection("orders").doc(sid()).set(build("مؤكد"));
    $("#err").textContent="تم حفظ الطلب ✓";
    for(const k of Object.keys(cart)){delete cart[k];drawQty(k)}
    refresh();
    setTimeout(()=>{$("#sheet").classList.remove("show");$("#err").textContent=""},1200);
  }catch(e){$("#err").textContent="تعذر الحفظ: "+((e&&(e.code||e.message))||"خطأ غير معروف")}
};
$("#loc").onclick=()=>{
  const st=$("#locst");
  if(!navigator.geolocation){st.textContent="الموقع غير مدعوم، اكتب العنوان.";return}
  st.textContent="جارٍ تحديد الموقع…";
  navigator.geolocation.getCurrentPosition(
    p=>{LOC="https://maps.google.com/?q="+p.coords.latitude.toFixed(6)+","+p.coords.longitude.toFixed(6);st.textContent="تم إرفاق موقعك ✓"},
    ()=>{st.textContent="تعذر تحديد الموقع تلقائياً هنا. اكتب وصف مكانك أو الصق رابط موقعك في الخانة أدناه، أو أرسل موقعك من واتساب (📎 ثم الموقع) بعد فتح المحادثة.";$("#locin").style.display="block"},
    {enableHighAccuracy:true,timeout:10000});
};
$("#aclose").onclick=()=>$("#admin").classList.remove("show");
const ORD={};
let PER="all";
const periodBar=()=>'<div class="acts">'+[["day","اليوم"],["week","7 أيام"],["all","الكل"]].map(([k,t])=>'<button class="mini" data-p="'+k+'"'+(PER===k?' style="border-color:var(--brand);font-weight:700"':'')+'>'+t+'</button>').join("")+'<button class="mini" data-a="csv">تصدير CSV</button></div>';
async function exportCsv(){
  try{
    const dl=await claude.use("downloads");
    if(!dl)return;
    const s=await DB.collection("orders").get();
    const rows=s.docs.map(d=>d.data()).sort((a,b)=>a.createdAt-b.createdAt);
    const q=v=>'"'+String(v==null?"":v).replace(/"/g,'""')+'"';
    const head=["رقم الطلب","التاريخ","الحالة","النوع","الاسم","الهاتف","العنوان","الأصناف","الإجمالي"];
    const body=rows.map(o=>[o.orderNo||"",new Date(o.createdAt).toLocaleString("en-GB"),o.status||"جديد",o.type,o.name,o.phone,o.address,o.lines.map(l=>l.qty+"x "+l.name).join(" | "),o.total].map(q).join(","));
    await dl.save({filename:"orders.csv",data:"\ufeff"+[head.map(q).join(","),...body].join("\n")});
  }catch(e){}
}
async function loadAdmin(){
  const box=$("#astats");
  try{
    const s=await DB.collection("orders").get();
    const os=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>b.createdAt-a.createdAt);
    os.forEach(o=>ORD[o.id]=o);
    if(!os.length){box.textContent="لا توجد طلبات محفوظة بعد.";return}
    const t0=new Date();t0.setHours(0,0,0,0);
    const since=PER==="day"?t0.getTime():PER==="week"?Date.now()-6048e5:0;
    const view=os.filter(o=>o.createdAt>=since);
    const live=view.filter(o=>o.status!=="ملغي");
    const sum=live.reduce((a,o)=>a+o.total,0),cat={},day={},prod={};
    live.forEach(o=>{
      const d=new Date(o.createdAt).toLocaleDateString("ar-LY");
      day[d]=(day[d]||0)+1;
      o.lines.forEach(l=>{cat[l.cat]=(cat[l.cat]||0)+l.qty;prod[l.name]=(prod[l.name]||0)+l.qty});
    });
    const row=(a,b)=>`<div class="row"><span>${a}</span><b>${b}</b></div>`;
    const mini=(id,a,t)=>`<button class="mini" data-id="${id}" data-a="${a}">${t}</button>`;
    const item=o=>{
      const st=o.status||"جديد";
      return `<div class="ord">${row(esc(o.orderNo||"")+" "+new Date(o.createdAt).toLocaleString("ar-LY")+" - "+esc(o.name||"بدون اسم"),money(o.total))}
      <div class="acts"><span class="st ${st==="مؤكد"?"ok":st==="ملغي"?"no":""}">${st}</span>
      ${st!=="مؤكد"?mini(o.id,"ok","تأكيد"):""}${st!=="ملغي"?mini(o.id,"no","إلغاء"):""}${mini(o.id,"del","حذف")}</div></div>`;
    };
    box.innerHTML=periodBar()+row("عدد الطلبات (بدون الملغي)",live.length)
      +row("متوسط قيمة الطلب",live.length?money(Math.round(sum/live.length*100)/100):"-")
      +row("إجمالي المبيعات",money(sum))
      +"<h3>الطلبات في كل يوم</h3>"+Object.entries(day).map(([d,n])=>row(d,n)).join("")
      +"<h3>التصنيفات الأكثر طلباً (بالكمية)</h3>"+Object.entries(cat).sort((a,b)=>b[1]-a[1]).map(([c,n])=>row(c,n)).join("")
      +"<h3>الأصناف الأكثر مبيعاً</h3>"+Object.entries(prod).sort((a,b)=>b[1]-a[1]).slice(0,5).map(([c,n])=>row(c,n)).join("")
      +"<h3>الطلبات</h3>"+view.slice(0,30).map(item).join("")
      +'<div class="acts" style="margin-top:14px"><button class="mini" data-a="all">حذف كل الطلبات</button></div>';
  }catch(e){box.textContent="تعذر تحميل الطلبات: "+((e&&(e.code||e.message))||"خطأ غير معروف")}
}
$("#adm").onclick=()=>{
  $("#admin").classList.add("show");
  $("#astats").textContent="جارٍ التحميل…";
  loadAdmin();
};
$("#astats").onclick=async e=>{
  const pb=e.target.closest("button[data-p]");
  if(pb){PER=pb.dataset.p;loadAdmin();return}
  const b=e.target.closest("button[data-a]");
  if(!b)return;
  const a=b.dataset.a,id=b.dataset.id;
  if(a==="csv"){exportCsv();return}
  if((a==="del"||a==="all")&&!b.dataset.sure){
    b.dataset.sure="1";
    b.textContent="اضغط مرة أخرى للتأكيد";
    return;
  }
  try{
    if(a==="all"){
      const s=await DB.collection("orders").get();
      for(const d of s.docs)await DB.collection("orders").doc(d.id).delete();
    }else if(a==="del"){
      await DB.collection("orders").doc(id).delete();
    }else{
      const {id:_x,...rest}=ORD[id];
      await DB.collection("orders").doc(id).set({...rest,status:a==="ok"?"مؤكد":"ملغي"});
    }
    loadAdmin();
  }catch(x){$("#astats").textContent="تعذر التنفيذ: "+((x&&(x.code||x.message))||"خطأ")}
};
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
